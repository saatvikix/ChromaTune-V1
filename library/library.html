<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <link rel="stylesheet" href="../tuner/style/metronome-style.css"> -->
    <link rel="stylesheet" href="./style/library-style.css">


    <link rel="stylesheet" href="../global-style/global-style.css">
    <link rel="stylesheet" href="./style/dark-style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet">


    <script src="./js/chordSelector.js" defer></script>


    <title>ChromaTune - Library</title>
</head>

<body>

    <div class="sidebar">
        <div id="sidebarTitleContainer">
            <span id="sidebarTitle">Let's Learn!</span>
        </div>

        <div class="profileContainer">
            <div id="profileButton">

            </div>

            <div class="profileDetails">
                <span id="user-name">
                    Saatvik
                </span>
                <span id="user-email">
                    example.com
                </span>
            </div>
        </div>

        <div class="sidebarNavigators" id="tuner">

            <span class="tuning-fork icons"></span>
            <span class="sidebarNavigatorTitle">Tuner</span>

        </div>

        <div class="sidebarNavigators" id="metronome">

            <span class="metronome-button icons"></span>
            <span class="sidebarNavigatorTitle">Metronome</span>

        </div>

        <div class="sidebarNavigators" id="library">

            <span class="library-button icons"></span>
            <span class="sidebarNavigatorTitle">Chord Library</span>

        </div>

        <div class="sidebarNavigators">

            <span class="chord-chart-button icons"></span>
            <span class="sidebarNavigatorTitle">Chord Charts</span>

        </div>


        <div class="authentication">
            <button id="authButton" class="logout">LOGOUT</button>
        </div>
    </div>

    <div class="workingwindow">
        <div class="widget-container">
            <header class="widget-header">
                <span>(MIC.01)</span>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">STANDBY</span>
                </div>
            </header>

            <div class="logoArea">
                <span class="logoIcon"></span>
                <p class="title">ChromaTune</p>

            </div>
            <div class="chordSelector">
                <div class="rootSelector selector">
                    <span>Root</span>

                    <div class="slider" id="rootSlider">
                        <div class="track"></div>
                        <div class="thumb"></div>
                    </div>
                </div>

                <div class="qualitySelector selector">
                    <span>Quality</span>

                    <div class="slider" id="qualitySlider">
                        <div class="track"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
            </div>


            <div class="chordLabel">
                <span id="chordRoot">
                    C
                </span>
                <span id="chordQuality">
                    Major
                </span>
            </div>

            <div class="chordDiagram">
                <div class="diagramContainer">
                    <img src="./graphics/chords/c_major_01.svg" alt="C major chord diagram" id="diagramImage">
                </div>

                <button class="favButton" type="button" aria-label="Add chord to favourites" aria-pressed="false">
                    <span id="star"></span>
                </button>
            </div>

        </div>
    </div>

    <script src="../global-js/sidebar.js" defer></script>
</body>

</html>
