<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <link rel="stylesheet" href="../tuner/style/metronome-style.css"> -->
    <link rel="stylesheet" href="./style/library-style.css">


    <link rel="stylesheet" href="../global-style/global-style.css">
    <link rel="stylesheet" href="./style/dark-style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet">


    <script src="./js/chordSelector.js" defer></script>


    <title>ChromaTune - Library</title>
</head>

<body>
    <div class="widget-container">
        <header class="widget-header">
            <span>(MIC.01)</span>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">STANDBY</span>
            </div>
        </header>

        <div class="logoArea">
            <span class="logoIcon"></span>
            <p class="title">ChromaTune</p>

        </div>
        <div class="chordSelector">
            <div class="rootSelector selector">
                <span>Root</span>

                <div class="slider" id="rootSlider">
                    <div class="track"></div>
                    <div class="thumb"></div>
                </div>
            </div>

            <div class="qualitySelector selector">
                <span>Quality</span>

                <div class="slider" id="qualitySlider">
                    <div class="track"></div>
                    <div class="thumb"></div>
                </div>
            </div>
        </div>


        <div class="chordLabel">
            <span id="chordRoot">
                C
            </span>
            <span id="chordQuality">
                Major
            </span>
        </div>

        <div class="chordDiagram">
            <div class="diagramContainer">
                <img src="./graphics/chords/c_major_01.svg" alt="C major chord diagram" id="diagramImage">
            </div>

            <button class="chordPlayBtn">
                <span id="speaker"></span>
            </button>
        </div>

        <nav>
            <button class="navButtons" onclick="window.location.href='../tuner/tuner.html'">
                <span class="tuning-fork"></span>
            </button>


            <button class="navButtons" onclick="window.location.href='../metronome/metronome.html'">
                <span class="metronome-button"></span>
            </button>

            <button class="navButtons  selectedButtons" id="library">
                <span class="library-button"></span>
            </button>

        </nav>
    </div>

</body>

</html>
