<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../global-style/global-style.css">
    <link rel="stylesheet" href="./style/metronome-style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet">


    <script src="./js/metronome.js" defer></script>


    <title>ChromaTune - Metronome</title>
</head>

<body>
    <div class="widget-container">
        <header class="widget-header">
            <span>(MIC.01)</span>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">STANDBY</span>
            </div>
        </header>

        <div class="logoArea">
            <span class="logoIcon"></span>
            <p class="title">ChromaTune</p>

        </div>

        <div class="metronomeInterface">
            <div class="bpmInputArea">
                <div class="knob" role="img" aria-label="BPM knob">

                    <div class="bpmDisplay">
                        <div class="bpmNumber">128</div>
                        <div class="bpmLabel">BPM</div>
                    </div>

                </div>
            </div>
        </div>

        <div class="timeSignatureInterface">

            <div class="timeSignatureSettings">

                <button class="beatsCountButton" id="beatsIncrease" aria-label="Increase beats">+</button>

                <span id="beatsDisplay">4</span>

                <button class="beatsCountButton" id="beatsDecrease" aria-label="Decrease beats">−</button>

            </div>

            <div class="beatsPerMeasureText">
                <p>Beats Per Measure</p>
            </div>

        </div>

        <div class="player">
            <button id="playBtn" data-play-icon="./graphics/play-button.png"
                data-pause-icon="./graphics/pause-button.png" data-click-sound="./clicks/click1.mp3">

                <img id="playIcon" src="./graphics/play-button.png">
            </button>
        </div>

        <nav>
            <button class="navButtons" onclick="window.location.href='../tuner/home.html'">
                <span class="tuning-fork"></span>
            </button>


            <button class="navButtons selectedButtons" >
                <span class="metronome-button"></span>
            </button>

            <button class="navButtons" id="library" onclick="window.location.href='../library/library.html'">
                <span class="library-button"></span>
            </button>

        </nav>

    </div>




</body>

</html>
